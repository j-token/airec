name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release without the v prefix (e.g. 0.3.0). Bumps Cargo.toml, Cargo.lock and both plugin manifests on main, then tags v<version>."
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TARGET: x86_64-pc-windows-msvc

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Bump version
        id: bump
        shell: pwsh
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          $version = $env:VERSION.Trim() -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "version '$version' is not semver (e.g. 0.3.0)"
          }
          $tag = "v$version"
          git fetch --tags --quiet
          if (git tag --list $tag) { throw "tag $tag already exists" }

          $cargo = Get-Content Cargo.toml -Raw
          $cargo = ([regex]'(?m)^version\s*=\s*"[^"]*"').Replace($cargo, "version = `"$version`"", 1)
          Set-Content Cargo.toml $cargo -NoNewline
          cargo update --workspace
          if ($LASTEXITCODE -ne 0) { throw "cargo update --workspace failed" }

          foreach ($plugin in '.claude-plugin/plugin.json', '.codex-plugin/plugin.json') {
            $json = Get-Content $plugin -Raw
            $json = ([regex]'"version"\s*:\s*"[^"]*"').Replace($json, "`"version`": `"$version`"", 1)
            Set-Content $plugin $json -NoNewline
          }

          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock .claude-plugin/plugin.json .codex-plugin/plugin.json
          git commit -m "misc: 버전을 $version(으)로 올림"
          if ($LASTEXITCODE -ne 0) { throw "nothing to commit; main is already at $version" }
          git tag $tag
          git push --atomic origin HEAD:main $tag
          if ($LASTEXITCODE -ne 0) { throw "push failed" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

  release:
    needs: bump
    if: ${{ !cancelled() && (needs.bump.result == 'success' || needs.bump.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = if ($env:BUMPED_TAG) { $env:BUMPED_TAG } else { "${{ github.ref_name }}" }
          $version = $tag -replace '^v', ''
          $manifest = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($version -ne $manifest) {
            throw "tag $tag does not match workspace version $manifest"
          }
          foreach ($plugin in '.claude-plugin/plugin.json', '.codex-plugin/plugin.json') {
            $pluginVersion = (Get-Content $plugin -Raw | ConvertFrom-Json).version
            if ($version -ne $pluginVersion) {
              throw "tag $tag does not match $plugin version $pluginVersion"
            }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
        env:
          BUMPED_TAG: ${{ needs.bump.outputs.tag }}

      - name: Build
        run: cargo build --release --locked --target ${{ env.TARGET }} --bin airec

      - name: Smoke test
        shell: pwsh
        run: |
          $exe = "target\${{ env.TARGET }}\release\airec.exe"
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "airec --version failed" }

      - name: Package
        id: package
        shell: pwsh
        run: |
          $name = "airec-v${{ steps.version.outputs.version }}-${{ env.TARGET }}"
          New-Item -ItemType Directory -Path dist\$name | Out-Null
          Copy-Item "target\${{ env.TARGET }}\release\airec.exe" dist\$name\
          Copy-Item LICENSE, NOTICE, README.md dist\$name\
          Compress-Archive -Path dist\$name\* -DestinationPath "dist\$name.zip"
          $hash = (Get-FileHash "dist\$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "dist\$name.zip.sha256" -NoNewline
          "asset=dist/$name.zip" >> $env:GITHUB_OUTPUT
          "sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $fence = [string][char]0x60 * 3
          $notes = @(
            "Windows x86_64 and Linux x86_64 (X11) builds of airec $tag.",
            "",
            "Install on Windows:",
            "",
            ($fence + "powershell"),
            "irm https://raw.githubusercontent.com/${{ github.repository }}/main/install.ps1 | iex",
            $fence,
            "",
            "Install on Linux:",
            "",
            ($fence + "sh"),
            "curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh",
            $fence,
            "",
            "SHA256 of the Windows zip: ${{ steps.package.outputs.sha256 }}"
          )
          $notes -join "`n" | Set-Content dist\notes.md -Encoding utf8
          gh release create $tag --title $tag --notes-file dist\notes.md ${{ steps.package.outputs.asset }} "${{ steps.package.outputs.asset }}.sha256"

  release-linux:
    needs: [bump, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      LINUX_TARGET: x86_64-unknown-linux-gnu
      TAG: ${{ needs.bump.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag || github.ref }}

      # Built inside Ubuntu 22.04 so the binary links against the oldest glibc it supports.
      - name: Build on Ubuntu 22.04
        run: |
          docker run --rm -v "$PWD:/src" -w /src ubuntu:22.04 bash -c '
            set -euo pipefail
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq curl ca-certificates build-essential >/dev/null
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            cargo build --release --locked --target "'"$LINUX_TARGET"'" --bin airec
            "target/'"$LINUX_TARGET"'/release/airec" --version
          '

      - name: Package and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="airec-$TAG-$LINUX_TARGET"
          mkdir -p "dist/$name"
          cp "target/$LINUX_TARGET/release/airec" LICENSE NOTICE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          gh release upload "$TAG" "dist/$name.tar.gz" "dist/$name.tar.gz.sha256"
